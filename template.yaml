AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiAI backend (Day 1 - scan pipeline)

Parameters:
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  MockAnalysis:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Set to "1" to return fixed mock data without calling Bedrock. Remove before final demo.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 512

Resources:
  # ── API ──────────────────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST, GET, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # ── DynamoDB tables ───────────────────────────────────────────────────────
  PricesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: component
          AttributeType: S
      KeySchema:
        - AttributeName: component
          KeyType: HASH

  RecyclersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Lambda functions ───────────────────────────────────────────────────────
  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scan/
      Handler: app.handler
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MOCK_ANALYSIS: !Ref MockAnalysis
          PRICES_TABLE: !Ref PricesTable
          RECYCLERS_TABLE: !Ref RecyclersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt PricesTable.Arn
                - !GetAtt RecyclersTable.Arn
      Events:
        Scan:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /scan
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  PricesTableName:
    Value: !Ref PricesTable
  RecyclersTableName:
    Value: !Ref RecyclersTable
