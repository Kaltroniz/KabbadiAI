AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiAI backend (Day 1 - scan pipeline)

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
  MockAnalysis:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Set to "1" to return fixed mock data without calling Bedrock. Remove before final demo.
  GeminiApiKey:
    Type: String
    Default: ""
    Description: API Key for Google Gemini.
  GeminiModel:
    Type: String
    Default: "gemini-3.5-flash"
    Description: The exact model ID for Gemini.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 512

Resources:
  # ── API ──────────────────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST, GET, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # ── DynamoDB tables ───────────────────────────────────────────────────────
  PricesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: component
          AttributeType: S
      KeySchema:
        - AttributeName: component
          KeyType: HASH

  LotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  RecyclersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Lambda functions ───────────────────────────────────────────────────────
  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scan/
      Handler: app.handler
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MOCK_ANALYSIS: !Ref MockAnalysis
          PRICES_TABLE: !Ref PricesTable
          RECYCLERS_TABLE: !Ref RecyclersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt PricesTable.Arn
                - !GetAtt RecyclersTable.Arn
      Events:
        Scan:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /scan
            Method: POST

  PriceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/price/
      Handler: app.handler
      Environment:
        Variables:
          PRICES_TABLE: !Ref PricesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PricesTable.Arn
      Events:
        Price:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /price
            Method: POST

  RecyclersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/recyclers/
      Handler: app.handler
      Environment:
        Variables:
          RECYCLERS_TABLE: !Ref RecyclersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt RecyclersTable.Arn
      Events:
        Recyclers:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /recyclers
            Method: GET

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/agent/
      Handler: app.handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MOCK_ANALYSIS: !Ref MockAnalysis
          AGENT_MODE: "0"
          PRICES_TABLE: !Ref PricesTable
          RECYCLERS_TABLE: !Ref RecyclersTable
          LOTS_TABLE: !Ref LotsTable
          PROVIDER_ORDER: "gemini,bedrock"
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:PutItem
              Resource:
                - !GetAtt PricesTable.Arn
                - !GetAtt RecyclersTable.Arn
                - !GetAtt LotsTable.Arn
      Events:
        Agent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /agent
            Method: POST

  LotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/lots/
      Handler: app.handler
      Environment:
        Variables:
          LOTS_TABLE: !Ref LotsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
              Resource: !GetAtt LotsTable.Arn
      Events:
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /stats
            Method: GET
        GetLot:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /lots/{id}
            Method: GET

  AnalystFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/analyst/
      Handler: app.handler
      Timeout: 29
      Environment:
        Variables:
          LOTS_TABLE: !Ref LotsTable
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan]
              Resource: !GetAtt LotsTable.Arn
      Events:
        Analyst:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /analyst
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  PricesTableName:
    Value: !Ref PricesTable
  RecyclersTableName:
    Value: !Ref RecyclersTable
