AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiAI backend (Day 1 - scan pipeline)

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
  MockAnalysis:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Set to "1" to return fixed mock data without calling Bedrock. Remove before final demo.
  GeminiApiKey:
    Type: String
    Default: ""
    Description: API Key for Google Gemini.
  GeminiModel:
    Type: String
    Default: "gemini-3.5-flash"
    Description: The exact model ID for Gemini.
  JwtSecret:
    Type: String
    Default: "kabadiai-change-me-before-deploy"
    NoEcho: true
    Description: HMAC-SHA256 secret for signing JWT tokens. Override in samconfig.toml.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth 2.0 Client ID (web application). Used to verify Google ID tokens.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 512

Resources:
  # ── API ──────────────────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST, GET, OPTIONS]
        AllowHeaders: [content-type, authorization]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # ── DynamoDB tables ───────────────────────────────────────────────────────
  PricesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: component
          AttributeType: S
      KeySchema:
        - AttributeName: component
          KeyType: HASH

  LotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  RecyclersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PickupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ── Lambda functions ───────────────────────────────────────────────────────
  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scan/
      Handler: app.handler
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MOCK_ANALYSIS: !Ref MockAnalysis
          PRICES_TABLE: !Ref PricesTable
          RECYCLERS_TABLE: !Ref RecyclersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt PricesTable.Arn
                - !GetAtt RecyclersTable.Arn
      Events:
        Scan:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /scan
            Method: POST

  PriceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/price/
      Handler: app.handler
      Environment:
        Variables:
          PRICES_TABLE: !Ref PricesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PricesTable.Arn
      Events:
        Price:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /price
            Method: POST

  RecyclersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/recyclers/
      Handler: app.handler
      Environment:
        Variables:
          RECYCLERS_TABLE: !Ref RecyclersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt RecyclersTable.Arn
      Events:
        Recyclers:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /recyclers
            Method: GET

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/agent/
      Handler: app.handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MOCK_ANALYSIS: !Ref MockAnalysis
          AGENT_MODE: "0"
          PRICES_TABLE: !Ref PricesTable
          RECYCLERS_TABLE: !Ref RecyclersTable
          LOTS_TABLE: !Ref LotsTable
          PROVIDER_ORDER: "gemini,bedrock"
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:PutItem
              Resource:
                - !GetAtt PricesTable.Arn
                - !GetAtt RecyclersTable.Arn
                - !GetAtt LotsTable.Arn
      Events:
        Agent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /agent
            Method: POST

  LotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/lots/
      Handler: app.handler
      Environment:
        Variables:
          LOTS_TABLE: !Ref LotsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
              Resource: !GetAtt LotsTable.Arn
      Events:
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /stats
            Method: GET
        GetLot:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /lots/{id}
            Method: GET

  AnalystFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/analyst/
      Handler: app.handler
      Timeout: 29
      Environment:
        Variables:
          LOTS_TABLE: !Ref LotsTable
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan]
              Resource: !GetAtt LotsTable.Arn
      Events:
        Analyst:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /analyst
            Method: POST

  # ── Feature: Hotspot Map (GET /hotspots) ────────────────────────────────
  HotspotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/stats/
      Handler: app.handler
      Environment:
        Variables:
          LOTS_TABLE: !Ref LotsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt LotsTable.Arn
      Events:
        Hotspots:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /hotspots
            Method: GET

  # ── Feature: Bulk Pickup Alerts (GET + POST /pickup) ─────────────────────
  PickupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pickup/
      Handler: app.handler
      Environment:
        Variables:
          PICKUPS_TABLE: !Ref PickupsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt PickupsTable.Arn
      Events:
        PickupPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /pickup
            Method: POST
        PickupGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /pickup
            Method: GET

  # ── Feature: Authentication (POST /auth/register, /auth/login, /auth/google, GET /auth/me) ──
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/auth/
      Handler: app.handler
      Timeout: 15
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JwtSecret
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        AuthRegister:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /auth/register
            Method: POST
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /auth/login
            Method: POST
        AuthGoogle:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /auth/google
            Method: POST
        AuthMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /auth/me
            Method: GET

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  PricesTableName:
    Value: !Ref PricesTable
  RecyclersTableName:
    Value: !Ref RecyclersTable
  PickupsTableName:
    Value: !Ref PickupsTable
  UsersTableName:
    Value: !Ref UsersTable
